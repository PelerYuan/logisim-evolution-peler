# DO NOT QUOTE STRINGS!
#
group = com.cburch
name = logisim-evolution-peler

org.gradle.configuration-cache = true

# Current application version. Supported formats:
#  x.y.z (i.e. "3.6.9"
#  x.y.z-suffix (i.e. "3.6.9-beta1")
#
# * Suffix is optional and MUST be kept empty for **stable** rleases.
# * For non-stable builds use anything that reflects build state (i.e. "dev", "beta1", "rc1").
#
# NOTE: if you use suffix, you MUST separate it from the version number with a hypen.
version = 4.1.0

# Project website URL (the shorter the better)
# Peler Edition: points at the fork, not upstream -- only ever used for display/comment/
# open-in-browser purposes (About dialog, .circ/VHDL file header comments, CLI banner, Help menu
# "website" link), never for compatibility logic, so safe to repoint (unlike `version` above).
url = https://github.com/PelerYuan/logisim-evolution-peler/

# Fix sonar warning
systemProp.sonar.gradle.skipCompile = true
