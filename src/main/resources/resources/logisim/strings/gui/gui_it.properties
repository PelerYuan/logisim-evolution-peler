#
aboutPelerEditionTitle = Informazioni su Peler's Edition
aboutPelerEditionHeading = Peler's Edition
aboutPelerEditionVersion = Basato su Logisim-evolution %s
aboutPelerEditionIntro = Un fork personale non ufficiale di Logisim-evolution, realizzato per il lavoro universitario di una singola persona. Non è affiliato al progetto Logisim-evolution né da esso approvato o supportato.
aboutPelerEditionUpstreamHeading = Basato su Logisim-evolution
aboutPelerEditionUpstream = Praticamente tutto questo software è opera degli sviluppatori e dei collaboratori di Logisim-evolution. Questa edizione aggiunge soltanto le poche comodità elencate di seguito. Segnalate qui eventuali problemi con questa build, mai al progetto originale.
aboutPelerEditionChangesHeading = Cosa aggiunge questa edizione
aboutPelerEditionFeatureSticky = Posizionamento continuo: fai doppio clic su un componente nella libreria o nella barra degli strumenti per continuare a posizionarlo. Esc, Invio o clic destro termina la modalità.
aboutPelerEditionFeatureQuickRotate = Rotazione rapida: fai clic destro su un componente per ruotarlo di 90 gradi in senso orario. Il menu contestuale originale è passato a Ctrl+clic sinistro.
aboutPelerEditionFeatureWireSnap = Aggancio automatico dei fili: le estremità dei fili si agganciano a un piedino vicino, evidenziato da un anello verde.
aboutPelerEditionFeatureAnnotate = Annotazioni di schema: una nuova categoria «Annotazione» per allegare note di testo libero a un componente o a un'estremità del filo che incontra un componente. Le note ammettono più righe e seguono ciò a cui sono allegate. Fai doppio clic su uno strumento di annotazione per annotare in serie.
aboutPelerEditionFeatureFormat = Formato di file proprio: questa edizione salva in .pcirc e conserva tutto. “Salva con nome” offre anche .circ, il formato letto da Logisim-evolution ufficiale, dove le annotazioni diventano semplice testo. .circ resta a Logisim-evolution ufficiale.
aboutPelerEditionFeatureFind = Ricerca componenti: Ctrl+F apre un riquadro di ricerca flottante. Digita parte di un nome, nella tua lingua o in inglese, e scegli tra i risultati con le loro icone; Invio lo seleziona e continua l’inserimento, Maiusc+Invio ne inserisce uno solo.
aboutPelerEditionLicenseHeading = Licenza
aboutPelerEditionLicense = Distribuito con licenza GNU GPL v3, la stessa di Logisim-evolution.
