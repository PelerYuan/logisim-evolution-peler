#
# Logisim-evolution multi-platform release builder (Peler Edition)
#
# Manually triggered (workflow_dispatch), or triggered by pushing a tag matching "v*".
# Builds installers for every platform nightly.yml's build_* jobs cover (Windows MSI/zip,
# Linux deb/rpm/snap, Linux ARM deb/rpm, macOS dmg x2), each using the same Gradle tasks those
# jobs use, then publishes everything together as one GitHub Release.
#
# This workflow intentionally does NOT touch nightly.yml and does not run on ordinary pushes or
# pull requests. Windows ARM is skipped -- nightly.yml's own build_windows_arm job is commented
# out too, since jpackage's WiX-based MSI step isn't available on that runner.
#

name: "Release (Multi-platform)"

on:
  workflow_dispatch:
    inputs:
      channel:
        description: >-
          "dev" republishes the single rolling "dev" pre-release, replacing whatever was there --
          this is the normal choice while iterating, and keeps the releases page from filling up
          with one superseded build per change. "stable" publishes a permanent release under
          tag_name below. Pushing a "v*" tag always means stable.
        required: true
        default: "dev"
        type: choice
        options:
          - "dev"
          - "stable"
      platforms:
        description: >-
          Which platforms to build. "windows" builds only the MSI and portable zip, which is the
          quick way to get a dev build in front of a Windows tester -- the other three jobs take
          far longer and are pure waiting when the change is not platform-specific. Anything
          published as a stable release should use "all".
        required: true
        default: "all"
        type: choice
        options:
          - "all"
          - "windows"
      tag_name:
        description: >-
          Stable releases only; ignored for the dev channel and when triggered by pushing a "v*"
          tag (the pushed tag is used instead). If left blank, defaults to "v<version from
          gradle.properties>". Convention: "v<peler major>.<peler minor>.<peler build number>"
          (e.g. "v1.1.0"), independent of upstream's own version -- this also becomes every
          platform's package version number (see the "prep" job).
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  JDK_VERSION: 21
  JDK_DISTRO: 'temurin'

# Narrowly scoped to this workflow only - nightly.yml and other workflows are untouched and keep
# their own (more restrictive) default permissions.
permissions:
  contents: write

jobs:
  # ###############################################################################################
  # Resolves the release tag and Peler Edition version ONCE, shared by every platform job below
  # and the final publish step, so they can't disagree with each other.
  prep:
    name: "Determine version / release tag"
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.info.outputs.tag_name }}
      peler_version: ${{ steps.info.outputs.peler_version }}
      lse_name: ${{ steps.info.outputs.lse_name }}
      is_dev: ${{ steps.info.outputs.is_dev }}
      release_name: ${{ steps.info.outputs.release_name }}
      windows_only: ${{ steps.info.outputs.windows_only }}
    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7

      # Same version-string parsing nightly.yml's "git_check" job uses, plus resolving the tag to
      # publish the release under.
      - name: "Determine version / release tag"
        id: info
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
          INPUT_CHANNEL: ${{ github.event.inputs.channel }}
          INPUT_PLATFORMS: ${{ github.event.inputs.platforms }}
          RUN_NUMBER: ${{ github.run_number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Have no mercy.
          set -euo pipefail

          declare -r version_prop=$(grep '^version\s*=.*' gradle.properties | awk '{print $3}')
          declare -r lse_name="$(grep -F name gradle.properties | awk '{print $3}')"
          echo "lse_name=${lse_name}" >> "$GITHUB_OUTPUT"

          # A pushed tag is always a stable release; otherwise the channel input decides, and it
          # defaults to dev so that a hurried manual run can't accidentally mint a permanent one.
          is_dev="false"
          if [[ "${GITHUB_REF_TYPE}" != "tag" && "${INPUT_CHANNEL}" != "stable" ]]; then
            is_dev="true"
          fi
          echo "is_dev=${is_dev}" >> "$GITHUB_OUTPUT"

          # Windows-only is a manual-dispatch convenience, never something a pushed tag can
          # ask for: a tag means a stable release, and those ship every platform.
          windows_only="false"
          if [[ "${GITHUB_REF_TYPE}" != "tag" && "${INPUT_PLATFORMS}" == "windows" ]]; then
            windows_only="true"
          fi
          echo "windows_only=${windows_only}" >> "$GITHUB_OUTPUT"

          if [[ "${is_dev}" == "true" ]]; then
            # One rolling pre-release, always at the same tag, so the releases page holds exactly
            # one dev entry however many times we build -- and the download URL never changes.
            resolved_tag="dev"
            echo "release_name=Development build (${RUN_NUMBER})" >> "$GITHUB_OUTPUT"

            # The package version can't come from the tag here: "dev" isn't numeric, and jpackage
            # is strict about this in ways that only show up on some platforms. macOS rejects a
            # first number of 0 outright, and the Windows MSI ProductVersion field caps the parts
            # at 255.255.65535 -- so a date-derived version like 2026.8.8 would fail there too.
            # github.run_number is monotonic, unique per build, and stays well inside 65535.
            #
            # It must also sort ABOVE the newest stable release. Every channel shares one
            # --win-upgrade-uuid, so Windows Installer compares these numbers across channels: the
            # old fixed "1.0.<run>" scheme made every dev build look older than stable v1.1.0 and
            # refuse to install over it, even though dev is by definition the newer code. So the
            # major.minor is taken from the current stable release and only the patch counts builds.
            #
            # Read from the GitHub release marked latest, NOT from git tags -- this repository still
            # carries upstream's tags, and the highest of those is v4.1.0. The dev release is a
            # prerelease, so /releases/latest already excludes it.
            latest_stable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
            stable_base="${latest_stable#v}"
            stable_base="${stable_base%%-*}"
            dev_major="${stable_base%%.*}"
            dev_minor="${stable_base#*.}"
            dev_minor="${dev_minor%%.*}"
            if [[ ! "${dev_major}" =~ ^[0-9]+$ || ! "${dev_minor}" =~ ^[0-9]+$ ]]; then
              # No stable release yet, or an unparseable tag. 1.1 is where stable numbering starts.
              echo "::warning::No parseable stable release (got '${latest_stable}'); defaulting dev version base to 1.1"
              dev_major=1
              dev_minor=1
            fi
            peler_version="${dev_major}.${dev_minor}.${RUN_NUMBER}"
          else
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              resolved_tag="${GITHUB_REF_NAME}"
            elif [[ -n "${INPUT_TAG_NAME}" ]]; then
              resolved_tag="${INPUT_TAG_NAME}"
            else
              resolved_tag="v${version_prop}"
            fi

            # Stable must bump the major or the minor, never the patch: dev builds occupy the whole
            # patch range of the current major.minor, so a stable "1.1.1" would sort BELOW dev
            # builds like 1.1.32 and could not be installed over them. Failing here is deliberate --
            # the alternative is a release that silently cannot be upgraded to.
            if [[ ! "${resolved_tag}" =~ ^v[0-9]+\.[0-9]+\.0$ ]]; then
              echo "::error::Stable tag '${resolved_tag}' must look like vX.Y.0 -- the patch field belongs to the dev channel (see the version scheme in CLAUDE.md)."
              exit 1
            fi

            echo "release_name=${resolved_tag}" >> "$GITHUB_OUTPUT"
            peler_version=""
          fi
          echo "tag_name=${resolved_tag}" >> "$GITHUB_OUTPUT"

          # Peler Edition: every platform's package version (MSI ProductVersion, deb/rpm/dmg
          # version, filenames -- via `-PpelerAppVersion` in each build job below), independent of
          # upstream's version in gradle.properties (which never changes between our releases, so
          # it's useless for telling one of our builds apart from another -- see the
          # PELER_APP_VERSION comment in build.gradle.kts). Derived from the release tag: strip
          # the leading "v" and anything from the first "-"/"+" onward, since Windows/macOS
          # package versioning must be pure numeric x.y.z (Linux is more permissive, but this
          # value is always plain numeric anyway so it's safe there too). Convention going
          # forward: tag releases "v<peler major>.<peler minor>.<peler build number>" (e.g.
          # "v1.0.5"), independent of upstream's own version number.
          if [[ -z "${peler_version}" ]]; then
            peler_version=$(echo "${resolved_tag}" | sed -E 's/^v//; s/[-+].*$//')
          fi
          echo "peler_version=${peler_version}" >> "$GITHUB_OUTPUT"

  # ###############################################################################################

  build_windows:
    name: "Windows build"
    runs-on: windows-latest
    needs: prep
    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}

      # Same Gradle task nightly.yml's build_windows job uses, plus `-PpelerAppVersion` so the MSI
      # carries our own release version instead of upstream's unchanging "4.2.0" base (see the
      # PELER_APP_VERSION comment in build.gradle.kts). The whole `-Pkey=value` MUST be quoted as
      # one argument: this runner's default shell is PowerShell, which (confirmed by reproducing
      # locally) mis-tokenizes an unquoted "-Pkey=1.0.5"-shaped argument, splitting it mid-value
      # and handing Gradle a bogus extra task name (e.g. "createMsi" + ".0.5") -> build failure.
      - name: "Build MSI"
        run: .\gradlew.bat createMsi "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      - name: "Build self-contained archive for Windows"
        run: .\gradlew.bat createWindowsPortableZip "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      - name: "Upload Windows artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            build/dist/${{ needs.prep.outputs.lse_name }}-${{ needs.prep.outputs.peler_version }}-amd64.msi
            build/dist/${{ needs.prep.outputs.lse_name }}-${{ needs.prep.outputs.peler_version }}-windows-amd64.zip
          if-no-files-found: error

  # ###############################################################################################

  build_linux:
    name: "Linux build"
    runs-on: ubuntu-latest
    needs: prep
    if: needs.prep.outputs.windows_only != 'true'
    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7

      # Same as nightly.yml's build_linux job -- a plain local Snap build (no store publish, that
      # step is commented out upstream too since it needs SNAPCRAFT_STORE_CREDENTIALS we don't have).
      - name: "Build Snap package"
        uses: snapcore/action-build@v1
        id: snapcraft

      - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}

      - name: "Build DEB"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew createDeb "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      - name: "Build RPM"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew createRpm "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      # Snap is deliberately NOT included below: `snap/snapcraft.yaml` is still unbranded (produces
      # "logisim-evolution_3.8.0-dev_amd64.snap" -- wrong name and version, see ROADMAP.md backlog),
      # so it isn't fit to publish yet. Built above purely to keep CI signal that snap packaging
      # still works; `steps.snapcraft.outputs.snap` intentionally goes unused past that point.
      #
      # Also: don't mix a path outside `build/dist/` into this list. `actions/upload-artifact`
      # computes each artifact's root as the least-common-ancestor of every listed path -- when
      # every path shares `build/dist/`, that directory itself disappears from the zip (matching
      # every other platform job here), but a single outside path (the snap used to be one) forces
      # the LCA up to the repo root, which silently nests the deb/rpm one level deeper than
      # `publish`'s artifact-merge step expects. Confirmed by v1.0.8's first automated release: the
      # deb/rpm silently failed to reach the release while the snap (at the now-common root) did.
      - name: "Upload Linux artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            build/dist/${{ needs.prep.outputs.lse_name }}_${{ needs.prep.outputs.peler_version }}_amd64.deb
            build/dist/${{ needs.prep.outputs.lse_name }}-${{ needs.prep.outputs.peler_version }}-1.x86_64.rpm
          if-no-files-found: error

  # ###############################################################################################

  build_linux_arm:
    name: "Linux Arm build"
    runs-on: ubuntu-22.04-arm
    needs: prep
    if: needs.prep.outputs.windows_only != 'true'
    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7
      - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}

      - name: "Build Arm DEB"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew createDeb "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      - name: "Build Arm RPM"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew createRpm "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      - name: "Upload Linux ARM artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-arm
          path: |
            build/dist/${{ needs.prep.outputs.lse_name }}_${{ needs.prep.outputs.peler_version }}_arm64.deb
            build/dist/${{ needs.prep.outputs.lse_name }}-${{ needs.prep.outputs.peler_version }}-1.aarch64.rpm
          if-no-files-found: error

  # ###############################################################################################

  build_macos:
    name: "macOS build"
    runs-on: macos-latest
    needs: prep
    if: needs.prep.outputs.windows_only != 'true'
    steps:
      - name: "Checkout sources"
        uses: actions/checkout@v7

      - name: Set up aarch64 JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}

      - name: "Build aarch64 DMG"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew createDmg "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      - name: Set up x86_64 JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}
          architecture: "x64"

      # build.gradle.kts derives OS_ARCH from the active JVM's `os.arch` system property, which
      # differs now that an x64 JDK is active -- so this naturally produces a differently-named
      # x86_64.dmg without colliding with the aarch64.dmg above (mirrors nightly.yml's own
      # build_macos job, which relies on the exact same mechanism).
      - name: "Build x86_64 DMG"
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew createDmg "-PpelerAppVersion=${{ needs.prep.outputs.peler_version }}" -x checkstyleMain -x checkstyleTest

      - name: "Upload macOS artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            build/dist/${{ needs.prep.outputs.lse_name }}-${{ needs.prep.outputs.peler_version }}-aarch64.dmg
            build/dist/${{ needs.prep.outputs.lse_name }}-${{ needs.prep.outputs.peler_version }}-x86_64.dmg
          if-no-files-found: error

  # ###############################################################################################

  publish:
    name: "Publish GitHub Release"
    runs-on: ubuntu-latest
    needs: [prep, build_windows, build_linux, build_linux_arm, build_macos]
    # A skipped job makes every dependent job skip too, unless the condition is spelled out.
    # Windows must have succeeded; the other three are allowed to be skipped but not failed.
    if: >-
      !cancelled()
      && needs.build_windows.result == 'success'
      && needs.build_linux.result != 'failure'
      && needs.build_linux_arm.result != 'failure'
      && needs.build_macos.result != 'failure'
    steps:
      - name: "Download all platform artifacts"
        uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      # A dev build REPLACES the rolling pre-release rather than adding to it. Deleting first is
      # the only reliable way: the asset filenames carry the version (1.0.<run number>), so they
      # differ every build and would otherwise pile up on the same release forever. Deleting the
      # tag too makes the next publish re-point it at this commit -- updating a release does not
      # move an existing tag on its own.
      - name: "Clear previous dev release"
        if: needs.prep.outputs.is_dev == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release delete dev --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag || true

      # Recursive glob (`dist/**/*`, not `dist/*`) on purpose: if any future job's artifact ever ends
      # up with a nested path again (see the comment on build_linux's upload step above for exactly
      # how that happens), this still finds the files instead of silently dropping them.
      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.tag_name }}
          name: ${{ needs.prep.outputs.release_name }}
          files: dist/**/*
          prerelease: ${{ needs.prep.outputs.is_dev == 'true' }}
          target_commitish: ${{ github.sha }}
          body: >-
            ${{ needs.prep.outputs.is_dev == 'true' && 'Rolling development build, replaced on every change. Not a release -- expect rough edges, and use the newest normal release for anything that matters.' || '' }}
            ${{ needs.prep.outputs.windows_only == 'true' && 'Windows only: the Linux and macOS packages were deliberately not built for this one, they are not missing because something failed.' || '' }}
