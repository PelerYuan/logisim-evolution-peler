#
# Logisim-evolution Windows release builder (Peler Edition)
#
# Manually triggered (workflow_dispatch), or triggered by pushing a tag matching "v*".
# Builds the Windows MSI installer and the portable ZIP archive using the same Gradle
# tasks nightly.yml's "build_windows" job uses, then publishes them as a GitHub Release.
#
# This workflow intentionally does NOT touch nightly.yml and does not run on ordinary
# pushes or pull requests.
#

name: "Release (Windows)"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: >-
          Release tag to use for a manual run. Ignored when this workflow was triggered by
          pushing a "v*" tag (the pushed tag is used instead). If left blank, defaults to
          "v<version from gradle.properties>". Convention: "v<peler major>.<peler minor>.<peler
          build number>" (e.g. "v1.0.5"), independent of upstream's own version -- this also
          becomes the built MSI/zip's own version number (see "Determine version / release tag").
        required: false
        default: ""
  push:
    tags:
      - "v*"

env:
  JDK_VERSION: 21
  JDK_DISTRO: 'temurin'

# Narrowly scoped to this workflow only - nightly.yml and other workflows are untouched
# and keep their own (more restrictive) default permissions.
permissions:
  contents: write

jobs:
  build_windows_release:
    name: "Windows build + GitHub Release"
    runs-on: windows-latest

    steps:
      # https://github.com/marketplace/actions/checkout
      - name: "Checkout sources"
        uses: actions/checkout@v7

      - name: Set up JDK ${{ env.JDK_VERSION }} ${{ env.JDK_DISTRO }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: ${{ env.JDK_DISTRO }}

      # Same version-string parsing nightly.yml's "git_check" job uses, plus resolving the
      # tag to publish the release under.
      - name: "Determine version / release tag"
        id: info
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ github.event.inputs.tag_name }}
        run: |
          # Have no mercy.
          set -euo pipefail

          declare -r version_prop=$(grep '^version\s*=.*' gradle.properties | awk '{print $3}')

          # Remove "-" (if present) from version string (mirrors nightly.yml).
          declare -r lse_version=$(echo "${version_prop}" | awk '{gsub("-","", $0); print}')
          echo "lse_version=${lse_version}" >> "$GITHUB_OUTPUT"

          # Version string with suffix stripped (mirrors nightly.yml).
          declare -r lse_version_short=$(echo "${version_prop}" | awk '{ split($0, v, "-")} {print v[1]}')
          echo "lse_version_short=${lse_version_short}" >> "$GITHUB_OUTPUT"

          declare -r lse_name="$(grep -F name gradle.properties | awk '{print $3}')"
          echo "lse_name=${lse_name}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            resolved_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${INPUT_TAG_NAME}" ]]; then
            resolved_tag="${INPUT_TAG_NAME}"
          else
            resolved_tag="v${version_prop}"
          fi
          echo "tag_name=${resolved_tag}" >> "$GITHUB_OUTPUT"

          # Peler Edition: the Windows package's own version (MSI ProductVersion + MSI/zip
          # filenames, via `-PpelerAppVersion` below), independent of upstream's version in
          # gradle.properties (which never changes between our releases, so it's useless for
          # telling one of our builds apart from another -- see the PELER_APP_VERSION comment in
          # build.gradle.kts). Derived from the release tag: strip the leading "v" and anything
          # from the first "-"/"+" onward, since MSI ProductVersion must be pure numeric x.y.z.
          # Convention going forward: tag releases "v<peler major>.<peler minor>.<peler build
          # number>" (e.g. "v1.0.5"), independent of upstream's own version number.
          declare -r peler_version=$(echo "${resolved_tag}" | sed -E 's/^v//; s/[-+].*$//')
          echo "peler_version=${peler_version}" >> "$GITHUB_OUTPUT"

      # Same Gradle task nightly.yml's build_windows job uses, plus `-PpelerAppVersion` so the MSI
      # carries our own release version instead of upstream's unchanging "4.2.0" base (see the
      # PELER_APP_VERSION comment in build.gradle.kts).
      - name: "Build MSI"
        run: .\gradlew.bat createMsi -PpelerAppVersion=${{ steps.info.outputs.peler_version }} -x checkstyleMain -x checkstyleTest

      # Same Gradle task nightly.yml's build_windows job uses, plus `-PpelerAppVersion` (see above).
      - name: "Build self-contained archive for Windows"
        run: .\gradlew.bat createWindowsPortableZip -PpelerAppVersion=${{ steps.info.outputs.peler_version }} -x checkstyleMain -x checkstyleTest

      - name: "Publish GitHub Release"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag_name }}
          name: ${{ steps.info.outputs.tag_name }}
          files: |
            build/dist/${{ steps.info.outputs.lse_name }}-${{ steps.info.outputs.peler_version }}-amd64.msi
            build/dist/${{ steps.info.outputs.lse_name }}-${{ steps.info.outputs.peler_version }}-windows-amd64.zip
