# Runs markdownlint on all *.md files

name: "MD Lint"

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  markdown_lint:
    name: "Markdown linter"
    runs-on: ubuntu-latest

    steps:
    # https://github.com/marketplace/actions/checkout
    - name: "Checkout sources"
      uses: actions/checkout@v6

    # https://github.com/marketplace/actions/paths-changes-filter
    - name: "Look for changed doc related files..."
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          docs:
            - 'docs/**'
            - '**/*.md'

    # https://github.com/marketplace/actions/my-markdown-linter
    - name: "Running markdown linter..."
      uses: ruzickap/action-my-markdown-linter@v1
      if: steps.filter.outputs.docs == 'true'
      with:
        # LICENSE is externally sourced and we're not going to fix it.
        # docs/peler-edition/mcp/ is a frozen, dated archive of the MCP
        # feature's own development QA reports and phase plans (each file
        # written once and never revised since); it stays exactly as
        # written rather than being reworded to satisfy a style linter.
        exclude: "LICENSE.md docs/peler-edition/mcp/"
        config_file: .markdownlint.yaml
